services:
  - type: web
    name: narrai-backend
    runtime: python
    rootDir: final/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COMFYUI_URL
        value: http://127.0.0.1:8188
      - key: COMFYUI_ENABLED
        value: "true"
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
