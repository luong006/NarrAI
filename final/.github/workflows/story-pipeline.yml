name: AI Story Pipeline

on:
  schedule:
    # Chạy tự động lúc 09:00 sáng thứ Hai hàng tuần (02:00 UTC)
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      limit:
        description: "Số lượng đề bài tối đa xử lý trong lần chạy này"
        required: false
        default: "3"
      story_id:
        description: "ID đề bài cụ thể (tùy chọn)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-story-pipeline
  cancel-in-progress: false

jobs:
  compile-stories:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 🚀 Run AI Story Pipeline Worker
        env:
          PYTHONIOENCODING: "utf-8"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL || 'claude-3-5-sonnet-20241022' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          GITHUB_BASE_BRANCH: "main"
        run: |
          if [ -n "${{ github.event.inputs.story_id }}" ]; then
            python backend/scripts/run_story_pipeline.py --story-id "${{ github.event.inputs.story_id }}"
          else
            python backend/scripts/run_story_pipeline.py --limit "${{ github.event.inputs.limit || 3 }}"
          fi

      - name: 💾 Commit & Push Updated Queue and Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ backend/data/
          if git diff --staged --quiet; then
            echo "No queue changes to commit."
          else
            git commit -m "chore(pipeline): update queue.json and story artifacts [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi
